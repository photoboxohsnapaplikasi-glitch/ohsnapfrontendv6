<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tes Koneksi Cloud - OH SNAP!</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:30px auto;padding:0 16px;color:#222}
h1{font-size:22px} button{background:#ff1493;color:#fff;border:0;padding:12px 20px;border-radius:10px;font-size:16px;cursor:pointer}
.row{border:1px solid #ddd;border-radius:10px;padding:12px 14px;margin:12px 0}
.ok{border-color:#16a34a;background:#f0fdf4}.bad{border-color:#dc2626;background:#fef2f2}.wait{background:#f9fafb}
small{color:#555;display:block;margin-top:4px;white-space:pre-wrap}
</style></head><body>
<h1>Tes Koneksi Cloud OH SNAP!</h1>
<p>Klik tombol, lalu kirim hasil 4 kotak di bawah ke Claude.</p>
<button onclick="run()">Mulai Tes</button>
<div id="out"></div>
<script src="cms-cloud.js"></script>
<script>
const U = OhSnapCloud.URL;
const K = 'sb_publishable_AG1wxrYq1moobWYJjC6htQ_TB-Siffl';
const H = { apikey: K, Authorization: 'Bearer ' + K };
const out = document.getElementById('out');
function row(title){ const d=document.createElement('div'); d.className='row wait'; d.innerHTML='<b>'+title+'</b><small>menunggu...</small>'; out.appendChild(d); return d; }
function done(d, ok, msg){ d.className='row '+(ok?'ok':'bad'); d.querySelector('small').textContent=(ok?'✅ ':'❌ ')+msg; }
async function run(){
  out.innerHTML='';
  const r1=row('1. Server Supabase bisa dijangkau?');
  try{
    const r=await fetch(U+'/rest/v1/',{headers:H,cache:'no-store'});
    done(r1,true,'Server menjawab (HTTP '+r.status+'). Jaringan & project aktif.');
  }catch(e){
    done(r1,false,'TIDAK bisa terhubung ('+e.message+').\nPenyebab umum: project Supabase di-pause, URL salah, atau jaringan/DNS memblokir supabase.co. Coba juga dari hotspot HP.');
    return;
  }
  const r2=row('2. Tabel cms_settings bisa dibaca?');
  let existing=null;
  try{
    const r=await fetch(U+'/rest/v1/cms_settings?id=eq.1&select=data',{headers:H,cache:'no-store'});
    const t=await r.text();
    if(r.ok){ const rows=JSON.parse(t); existing=rows[0]?rows[0].data:null;
      done(r2,true,existing?'Tabel ada & sudah berisi data (lastUpdated: '+(existing.lastUpdated||'-')+').':'Tabel ada tetapi masih kosong (normal sebelum simpan pertama).'); }
    else done(r2,false,'HTTP '+r.status+': '+t.slice(0,200)+'\n404 = tabel belum dibuat (jalankan supabase-setup.sql). 401/403 = policy/API key bermasalah.');
  }catch(e){ done(r2,false,e.message); }
  const r3=row('3. Tulis ke tabel diizinkan?');
  if(!existing){ done(r3,true,'Dilewati (tabel kosong). Tes sebenarnya: klik "Simpan Semua Perubahan" di admin.'); }
  else{
    try{
      await OhSnapCloud.save(existing);
      done(r3,true,'Tulis berhasil (data yang sama ditulis ulang, tidak ada yang berubah).');
    }catch(e){ done(r3,false,e.message+'\n401/403 = policy INSERT/UPDATE belum dibuat (jalankan supabase-setup.sql).'); }
  }
  const r4=row('4. Upload foto/video ke Storage diizinkan?');
  try{
    const blob=new Blob(['tes'],{type:'text/plain'});
    const url=await OhSnapCloud.upload(blob,'test','txt');
    const chk=await fetch(url,{cache:'no-store'});
    done(r4,chk.ok,chk.ok?'Upload & akses publik berhasil.':'Upload jalan, tapi bucket belum PUBLIC (HTTP '+chk.status+').');
  }catch(e){ done(r4,false,e.message+'\n"Bucket not found" = bucket ohsnap-media belum dibuat. 403 = policy storage belum dibuat.'); }
}
</script></body></html>
